name: Build BSTC APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BSTC Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build BSTC APK
        working-directory: bstc_app
        run: gradle assembleDebug

      - name: Upload BSTC APK
        uses: actions/upload-artifact@v4
        with:
          name: BSTC-apk
          path: bstc_app/app/build/outputs/apk/debug/*.apk
